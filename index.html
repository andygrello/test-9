```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Rockford Hills Police Department</title>

<style>

body{
font-family:Arial;
margin:0;
background:#0b1e3a;
color:white;
}

header{
display:flex;
align-items:center;
gap:15px;
padding:20px;
background:#08152b;
font-size:26px;
font-weight:bold;
}

header img{
height:65px;
}

nav{
text-align:center;
margin:20px;
}

button{
padding:10px 18px;
margin:5px;
border:none;
background:#1f4ea3;
color:white;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#356ad6;
}

.section{
display:none;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
color:black;
}

th,td{
border:1px solid #ccc;
padding:8px;
}

th{
background:#003366;
color:white;
}

input,select,textarea{
padding:6px;
margin:5px;
}

#loginBox{
text-align:center;
margin-top:150px;
}

.record{
background:#102b52;
padding:10px;
margin:10px 0;
border-radius:6px;
}

.progressBar{
width:300px;
height:20px;
background:#444;
margin-top:10px;
}

.progress{
height:20px;
background:#2ecc71;
}

</style>
</head>

<body>

<header>

<img src="logo.png">
Rockford Hills Police Department

<button onclick="logout()" style="margin-left:auto">Abmelden</button>

</header>


<div id="loginBox">

<h2>System Anmeldung</h2>

<input id="username" placeholder="Benutzername"><br>
<input id="password" type="password" placeholder="Passwort"><br>

<button onclick="login()">Anmelden</button>

</div>


<div id="system" style="display:none">

<nav>

<button onclick="openPage('home')">Startseite</button>
<button onclick="openPage('personal')">Personalblatt</button>
<button onclick="openPage('files')">Personalakten</button>
<button onclick="openPage('training')">Ausbildungskalender</button>
<button onclick="openPage('status')">📊 Ausbildungsstatus</button>

</nav>


<div id="home" class="section" style="display:block">

<h2>Willkommen beim RHPD Verwaltungssystem</h2>

</div>


<div id="personal" class="section">

<h1>Officer Verwaltung</h1>

<table id="officerTable">

<thead>
<tr>
<th>Name</th>
<th>Dienstgrad</th>
<th>Unit</th>
<th>Eintritt</th>
<th>Beförderung</th>
<th>Aktion</th>
</tr>
</thead>

<tbody></tbody>

</table>

<h3>Officer hinzufügen</h3>

<input id="name" placeholder="Name">

<select id="rank">
<option>Rookie</option>
<option>Officer I</option>
<option>Officer II</option>
<option>Officer III</option>
<option>Sergeant</option>
<option>Lieutenant</option>
<option>Captain</option>
<option>Commander</option>
<option>Chief of Police</option>
</select>

<select id="unit">
<option>Patrol Service</option>
<option>Special Tactics and Weapons</option>
<option>Crime Investigation Unit</option>
</select>

<input type="date" id="entryDate">
<input type="date" id="promotionDate">

<button onclick="addOfficer()">Officer hinzufügen</button>

</div>


<div id="files" class="section">

<h1>Personalakten</h1>

<select id="officerSelect" onchange="loadFile()"></select>

<textarea id="noteText" placeholder="Kommentar"></textarea><br>

<input type="file" id="imageUpload"><br>

<button onclick="addRecord()">Eintrag speichern</button>

<div id="records"></div>

</div>


<div id="training" class="section">

<h1>Ausbildungskalender</h1>

<input type="date" id="trainingDate">
<input type="time" id="trainingTime">

<select id="trainingName">

<option>GAB 01</option>
<option>GAB 02</option>
<option>Aktenschulung</option>
<option>Beweissicherung</option>
<option>Leitstellenausbildung</option>
<option>Einsatzleitung</option>
<option>Verhandlungsführung</option>
<option>Overwatch</option>

</select>

<button onclick="addTraining()">Termin hinzufügen</button>

<ul id="trainingList"></ul>

</div>


<div id="status" class="section">

<h1>📊 Ausbildungsstatus</h1>

<select id="statusOfficer" onchange="loadStatus()"></select>

<div id="trainingChecklist"></div>

<div id="progressText"></div>

<div class="progressBar">
<div class="progress" id="progressBar"></div>
</div>

</div>


</div>


<script>

let officers=JSON.parse(localStorage.getItem("officers"))||[]
let trainings=JSON.parse(localStorage.getItem("trainings"))||[]
let files=JSON.parse(localStorage.getItem("files"))||{}
let trainingStatus=JSON.parse(localStorage.getItem("trainingStatus"))||{}

const allCourses=[
"GAB 01",
"GAB 02",
"Aktenschulung",
"Beweissicherung",
"Leitstellenausbildung",
"Einsatzleitung",
"Verhandlungsführung",
"Overwatch"
]

function save(){

localStorage.setItem("officers",JSON.stringify(officers))
localStorage.setItem("trainings",JSON.stringify(trainings))
localStorage.setItem("files",JSON.stringify(files))
localStorage.setItem("trainingStatus",JSON.stringify(trainingStatus))

}


function login(){

if(username.value==="admin" && password.value==="rhpdpd"){

loginBox.style.display="none"
system.style.display="block"

}

}


function logout(){
location.reload()
}


function openPage(page){

document.querySelectorAll(".section").forEach(s=>s.style.display="none")
document.getElementById(page).style.display="block"

}


function renderOfficers(){

const body=document.querySelector("#officerTable tbody")
body.innerHTML=""

officers.forEach((o,i)=>{

const row=document.createElement("tr")

row.innerHTML=`

<td>${o.name||"-"}</td>
<td>${o.rank||"-"}</td>
<td>${o.unit||"-"}</td>
<td>${o.entryDate||"-"}</td>
<td>${o.promotionDate||"-"}</td>
<td><button onclick="deleteOfficer(${i})">Löschen</button></td>

`

body.appendChild(row)

})

updateOfficerSelect()
updateStatusSelect()

save()

}


function addOfficer(){

const name=document.getElementById("name").value.trim()

if(!name){alert("Name fehlt");return}

officers.push({

name:name,
rank:rank.value,
unit:unit.value,
entryDate:entryDate.value,
promotionDate:promotionDate.value

})

name.value=""

renderOfficers()

}


function deleteOfficer(i){

officers.splice(i,1)
renderOfficers()

}


/* PERSONALAKTEN */

function updateOfficerSelect(){

const sel=document.getElementById("officerSelect")
sel.innerHTML=""

officers.forEach(o=>{

const opt=document.createElement("option")
opt.value=o.name
opt.textContent=o.name

sel.appendChild(opt)

})

}


function loadFile(){

const officer=officerSelect.value
const box=document.getElementById("records")

box.innerHTML=""

if(!files[officer])return

files[officer].forEach(r=>{

const div=document.createElement("div")
div.className="record"

div.innerHTML=`<div>${r.text}</div>${r.img?`<img src="${r.img}">`:""}`

box.appendChild(div)

})

}


function addRecord(){

const officer=officerSelect.value
const text=noteText.value
const file=imageUpload.files[0]

if(!files[officer])files[officer]=[]

files[officer].push({text:text})

save()
loadFile()

}


/* AUSBILDUNGSKALENDER */

function addTraining(){

trainings.push({

date:trainingDate.value,
time:trainingTime.value,
name:trainingName.value

})

renderTrainingList()

save()

}


function renderTrainingList(){

const list=document.getElementById("trainingList")
list.innerHTML=""

trainings.forEach((t,i)=>{

const li=document.createElement("li")

li.innerHTML=`${t.date} ${t.time} ${t.name} <button onclick="deleteTraining(${i})">X</button>`

list.appendChild(li)

})

}


function deleteTraining(i){

trainings.splice(i,1)
renderTrainingList()
save()

}


/* AUSBILDUNGSSTATUS */

function updateStatusSelect(){

const sel=document.getElementById("statusOfficer")
sel.innerHTML=""

officers.forEach(o=>{

const opt=document.createElement("option")
opt.value=o.name
opt.textContent=o.name

sel.appendChild(opt)

})

}


function loadStatus(){

const officer=statusOfficer.value

const box=document.getElementById("trainingChecklist")
box.innerHTML=""

if(!trainingStatus[officer])trainingStatus[officer]=[]

allCourses.forEach(course=>{

const checked=trainingStatus[officer].includes(course)

const label=document.createElement("label")

label.innerHTML=`<input type="checkbox" ${checked?"checked":""}> ${course}`

label.querySelector("input").onchange=function(){

if(this.checked){

trainingStatus[officer].push(course)

}else{

trainingStatus[officer]=trainingStatus[officer].filter(c=>c!==course)

}

save()
updateProgress()

}

box.appendChild(label)
box.appendChild(document.createElement("br"))

})

updateProgress()

}


function updateProgress(){

const officer=statusOfficer.value
const done=trainingStatus[officer]?.length||0
const total=allCourses.length

progressText.innerText=`Fortschritt: ${done} / ${total}`

const percent=(done/total)*100

progressBar.style.width=percent+"%"

}


renderOfficers()
renderTrainingList()

</script>

</body>
</html>
```
